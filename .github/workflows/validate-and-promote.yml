name: Validate and promote pending submissions

# Triggered by the btsbootcamp-fanmail Lambda committing a file under
# pending/. Re-validates signups and comments and promotes accepted ones
# into bestofbootcamp (canonical state). See
# btsbootcamp/ARCHITECTURE_DECISIONS.md, "Write pipeline v3".

on:
  push:
    paths:
      - 'pending/**'
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two near-simultaneous submissions can't race on the
# bestofbootcamp Contents-API PUT or the pending/ cleanup push.
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote pending signups
        env:
          BOB_TOKEN: ${{ secrets.BOB_TOKEN }}
        run: node scripts/promote.js

      - name: Promote pending comments
        env:
          BOB_TOKEN: ${{ secrets.BOB_TOKEN }}
        run: node scripts/promote-comments.js

      - name: Remove processed pending files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pending/
          git diff --cached --quiet && { echo "nothing to clean up"; exit 0; }
          git commit -m "Clean up processed pending submissions"
          # The Lambda commits to this repo concurrently, so this push can
          # race and be rejected. Rebase-and-retry: without this, a failed
          # push leaves already-promoted pending files in place for the next
          # run to re-promote (promote-comments.js's idempotency guard is the
          # backstop for when this still loses).
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          echo "cleanup push failed after retries" >&2
          exit 1
